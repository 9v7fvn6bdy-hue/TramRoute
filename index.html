r See","Albertinenstr.","Antonplatz","Behaimstr.","Prenzlauer Allee/Ostseestr.","Stahlheimer Str./Wisbyer Str.","Stargarder Str.","U Eberswalder Str.","Schwedter Str.","U Rosenthaler Platz","S Hackescher Markt","S Oranienburger Str.","U Oranienburger Tor","U Oranienburger Tor"]}];
const stopNames=[...new Set(routes.flatMap(r=>[r.start,r.ziel,...r.route]))].sort((a,b)=>a.localeCompare(b,'de'));
const $=id=>document.getElementById(id);

function norm(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'');
}
function compact(s){
  return (s||'').toLowerCase().replace(/[.,]/g,'').replace(/\s+/g,' ').trim();
}
function same(a,b){return norm(a)===norm(b)}
function fullRoute(r){return [r.start,...r.route,r.ziel]}
function positions(arr,name){let n=norm(name),out=[]; arr.forEach((x,i)=>{if(norm(x)===n)out.push(i)}); return out}
function levenshtein(a,b){
  const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur} return prev[n];
}
function suggestions(value){
  let q=norm(value); if(!q)return stopNames.slice(0,12);
  let starts=stopNames.filter(s=>norm(s).startsWith(q));
  let contains=stopNames.filter(s=>!norm(s).startsWith(q)&&norm(s).includes(q));
  let near=[];
  if(starts.length+contains.length<8){
    near=stopNames.map(s=>[s,levenshtein(q,norm(s))]).filter(x=>x[1]<=Math.max(2,Math.floor(q.length/4))).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  }
  return [...new Set([...starts,...contains,...near])].slice(0,12);
}
function showSuggestions(input,sugBox){
  const arr=suggestions(input.value); sugBox.innerHTML='';
  if(!arr.length){sugBox.classList.add('hidden');return}
  arr.forEach(s=>{const d=document.createElement('div');d.className='suggestion';d.textContent=s;d.onclick=()=>{input.value=s;sugBox.classList.add('hidden');input.dispatchEvent(new Event('input'))};sugBox.appendChild(d)})
  sugBox.classList.remove('hidden');
}
[['from','fromSug'],['to','toSug'],['via','viaSug']].forEach(([a,b])=>{
  $(a).addEventListener('focus',()=>{showSuggestions($(a),$(b)); renderKeyboard(a,b.replace('Sug','Kb'))});
  $(a).addEventListener('input',()=>{showSuggestions($(a),$(b));renderKeyboard(a,b.replace('Sug','Kb'))});
  $(a).addEventListener('blur',()=>setTimeout(()=>$(b).classList.add('hidden'),180));
});

const rows=[['Q','W','E','R','T','Z','U','I','O','P','Ü'],['A','S','D','F','G','H','J','K','L','Ö','Ä'],['Y','X','C','V','B','N','M'],['←','Leeren','Leerzeichen']];
function possibleNext(value){
  const q=norm(value), set=new Set();
  if(!q) return new Set(rows.flat().filter(k=>/^[A-ZÄÖÜ]$/.test(k)));
  stopNames.forEach(s=>{let n=norm(s); if(n.startsWith(q)&&n.length>q.length) set.add(n[q.length].toUpperCase())});
  return set;
}
function renderKeyboard(inputId,kbId){
  const input=$(inputId), box=$(kbId), poss=possibleNext(input.value); box.classList.add('show');box.innerHTML='';
  rows.forEach(row=>{let r=document.createElement('div');r.className='keyrow';row.forEach(k=>{
    let b=document.createElement('button');b.type='button';b.className='key';b.textContent=k;
    if(k==='Leeren')b.classList.add('wide');if(k==='Leerzeichen')b.classList.add('space');
    if(/^[A-ZÄÖÜ]$/.test(k)&&input.value&&!poss.has(k))b.classList.add('disabled');
    b.onmousedown=e=>{e.preventDefault();if(b.classList.contains('disabled'))return;
      if(k==='←')input.value=input.value.slice(0,-1);else if(k==='Leeren')input.value='';else if(k==='Leerzeichen')input.value+=' ';else input.value+=k;
      input.dispatchEvent(new Event('input'));input.focus();};
    r.appendChild(b);});box.appendChild(r)});
}

function resolveName(v){
  const exact=stopNames.find(s=>norm(s)===norm(v)); return exact||v.trim();
}
function segment(r,a,b){
  const arr=fullRoute(r), ps=positions(arr,a), pt=positions(arr,b), out=[];
  ps.forEach(i=>pt.forEach(j=>{if(j>i)out.push(arr.slice(i,j+1))})); return out;
}
function directResults(a,b){
  const out=[]; routes.forEach(r=>segment(r,a,b).forEach(seg=>out.push({r,seg}))); return out;
}
function viaResults(a,v,b){
  const out=[];
  routes.forEach(r=>segment(r,a,v).forEach(s1=>{
    segment(r,v,b).forEach(s2=>out.push({type:'direct-via',legs:[{r,seg:s1},{r,seg:s2.slice(1)}]}))
  }));
  routes.forEach(r1=>segment(r1,a,v).forEach(s1=>{
    routes.forEach(r2=>segment(r2,v,b).forEach(s2=>{
      out.push({type:'transfer',legs:[{r:r1,seg:s1},{r:r2,seg:s2.slice(1)}]})
    }))
  }));
  const seen=new Set(); return out.filter(x=>{let k=x.legs.map(l=>l.r.umlauf+':'+l.seg.join('|')).join('>>');if(seen.has(k))return false;seen.add(k);return true}).slice(0,50);
}
function renderLeg(leg){
  return `<div><span class="badge">Linie 994</span><span class="badge">Umlauf ${leg.r.umlauf}</span>
  <div class="route">${leg.seg.map((s,i)=>`<div class="stop"><span class="num">${i+1}.</span>${escapeHtml(s)}</div>`).join('')}</div></div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function search(){
  let a=resolveName($('from').value),b=resolveName($('to').value),v=resolveName($('via').value);
  if(!a||!b){$('results').innerHTML='<div class="card warn">Bitte Start und Ziel eingeben.</div>';return}
  $('from').value=a;$('to').value=b;if($('via').value)$('via').value=v;
  let html=`<div class="card"><strong>${escapeHtml(a)} → ${escapeHtml(b)}</strong>${v?`<div class="muted">über ${escapeHtml(v)}</div>`:''}</div>`;
  if(!v){
    const res=directResults(a,b);
    if(!res.length) html+='<div class="card warn">Keine direkte Fahrt mit einem einzelnen Umlauf gefunden.</div>';
    res.forEach(x=>html+=`<div class="card result">${renderLeg(x)}</div>`);
  }else{
    const res=viaResults(a,v,b);
    if(!res.length) html+='<div class="card warn">Keine direkte oder über diese Haltestelle mögliche Verbindung gefunden.</div>';
    res.forEach(x=>{
      html+='<div class="card result">';
      if(x.type==='transfer')html+='<div class="ok"><strong>Umschildern an '+escapeHtml(v)+'</strong></div>';
      else html+='<div class="ok"><strong>Kein Umschildern nötig</strong></div>';
      x.legs.forEach((l,i)=>{if(i)html+='<div style="margin:10px 0;text-align:center">↻ <strong>Umschildern</strong></div>';html+=renderLeg(l)});html+='</div>';
    });
  }
  $('results').innerHTML=html;
}
$('search').onclick=search;
$('swap').onclick=()=>{let x=$('from').value;$('from').value=$('to').value;$('to').value=x};
</script>
